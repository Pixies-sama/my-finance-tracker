<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Finance Tracker</title>
    <link rel="stylesheet" href="../css/forget-password.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
  </head>
  <body>
    <main class="forgot-container">
      <a href="../Auth/signin.html" class="back-link">
        <span class="material-symbols-outlined"> arrow_back </span> 
        <span>Back to Sign In</span> 
      </a>

      <section class="forgot-card">
        <div class="logo">
          <div>
            <img
              src="../media/logo.png"
              alt=""
              width="50"
              height="50"
              style="border-radius: 18px"
            />
          </div>
          <span>Finance Tracker</span>
        </div>

        <div class="lock-icon">
          <span class="material-symbols-outlined"> lock_reset </span>
        </div>

        <h1>Forgot Password?</h1>

        <p class="description">
          Don't worry! Enter the email address associated with your account and
          we'll send you a link to reset your password.
        </p>

        <form id="forgotPasswordForm">
          <label for="email">Email Address</label>

          <input
            type="email"
            id="email"
            placeholder="Enter your email address"
            autocomplete="email"
            required
          />

          <p id="forgotMessage" aria-live="polite"></p>

          <button type="submit" id="resetButton">Send Reset Link</button>
        </form>

        <p class="footer-text">
          Remember your password?
          <a href="../Auth/signin.html">Sign In</a>
        </p>
      </section>

      <p class="copyright">&copy; 2026 Finance Tracker. All rights reserved.</p>
    </main>

    <script type="module" src="../js/forget-password.js"></script>
  </body>
</html>
